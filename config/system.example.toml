# 与其余三份example一起复制成同目录实际TOML；实际文件已被Git忽略。
# 推荐把真实 Key 放在环境变量中，不要提交到 Git。

[llm]
request_timeout_seconds = 90
max_retries = 2

# Models, Feishu and MCP use their sibling files in config/.

[agent]
system_prompt = "你是 Memoria，用户的长期 AI 伙伴。用与用户相同的语言回答。"
# 本地服务默认总上下文 8192；输出预算须留出输入空间。
max_tokens = 1024
max_iterations = 20

[agent.context]
memory_window = 40
char_budget = 60000
# 完整请求（含所有消息、工具定义/结果与参数）的 UTF-8 字节上限；不是远程Token数。
reader_input_bytes = 240000
reader_safety_tokens = 128
# 本地进程可核验完整模板Token；HTTP仅在使用已升级的Memoria本地服务时显式开启。
reader_local_count = false
# reader_context_tokens = 8192  # 精确窗口可选；远程无可信tokenizer时拒绝，不能用BGE估算。

[agent.skills]
enabled = true
directory = "skills"
max_inject = 2

[agent.tools]
# 启用后，非 always_on 工具经 tool_search + tool_call 按需暴露，避免撑爆上下文。
search_enabled = true
# http_get 仅允许这些主机，供 weather / summarize 等技能使用。
http_allowed_hosts = ["wttr.in", "api.open-meteo.com", "open-meteo.com"]

[agent.mcp]
# 从 JSON 加载外部 MCP server；示例见 mcp_servers.example.json。
enabled = true

[agent.drift]
# 空闲时跑限定技能（整理记忆候选等）；默认关闭，按需开启。
enabled = false
min_idle_seconds = 300
interval_seconds = 10800
max_steps = 8
daily_budget = 6
quiet_hours = [0, 1, 2, 3, 4, 5, 6]
allowed_skills = ["drift-digest", "memory-review"]
allow_write_tools = ["memorize"]
timezone = "Asia/Shanghai"

[memory.markdown]
enabled = true
directory = "data/markdown"

[memory.retrieval]
# auto 会优先使用可选 sqlite-vec，未安装时回退 JSON 向量扫描。
vector_backend = "auto"
vector_scan_limit = 2000

[memory.worker]
approval_mode = "llm" # 低风险候选经模型证据审核自动入库；manual保留全部人工审核
lease_seconds = 180
max_retries = 3
backoff_seconds = 5

# Observation先记录单次行为，跨会话证据足够后才由模型提出模式并独立审核。
# 阈值是工程起点；不将重复提问自动等同于永久偏好。
[memory.formation]
enabled = true
min_sources = 3
min_sessions = 2
max_observations = 24
retention_days = 90
core_half_life_days = 45
core_chars = 1200

# 分层预算是字符上限（不是精确 token），适合本地单用户运行的调优起点。
# 说明与来源：docs/implemented/记忆分层与配置.md。共享记忆仍独立使用空间权限。
[memory.layers]
enabled = true
episodic_enabled = true
semantic_chars = 3000
episodic_chars = 1800
procedural_chars = 2400
summary_chars = 2000
catalog_chars = 1200
self_chars = 1200
context_chars = 12000
episode_ttl_days = 90
episode_top_k = 3
episode_max_active = 1000
maintenance_interval_seconds = 3600
retrieval_max_calls = 6
retrieval_max_chars = 12000

[server]
host = "127.0.0.1"
port = 2237

[server.security]
# 正式网关始终要求账号登录；此内部服务 Token 不替代用户登录。
api_token = ""
allowed_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]
rate_limit_per_minute = 0
max_request_bytes = 1048576

[observability]
metrics_enabled = true

[storage]
database = "data/memoria.db"
