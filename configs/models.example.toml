# 模型参数集中放这里；复制到 configs/local/models.toml 后修改。
# 在根 config.toml 设置 [models] file = "configs/local/models.toml"。
# base_url 填 API 根地址（通常含 /v1），不要填到 /chat/completions 或 /embeddings。
# 模型标识由服务端 /v1/models 或供应商确认；本文件不保存真实 Key。

# LLM：本地或远程均走 OpenAI 兼容 Chat Completions。
[llm.main]
backend = "openai"
model = "model/Qwen3.5-2B"
base_url = "http://127.0.0.1:8080/v1"
api_key = ""
# 远程示例：model = "你的服务端模型ID"
# base_url = "https://你的供应商/v1"
# api_key = "${MEMORIA_LLM_API_KEY}"
# 仅官方 DeepSeek HTTPS 支持：thinking = "disabled"（不填则不发送开关）

[llm.fast]
backend = "openai"
model = "model/Qwen3.5-2B"
base_url = "http://127.0.0.1:8080/v1"
api_key = ""
# fast可单独配置；不配置fast表时使用main，不会自动复制main的私密配置。

# Embedding：当前本地只配置BGE small v1.5，不把任意HF模型都当BGE。
[memory.embedding]
backend = "bge"
model = "model/bge-small-zh-v1.5"
device = "auto" # auto / cuda / cpu；不需要另起8080、不需要Key、不联网下载
# 切API或本地OpenAI兼容Embedding时，替换整个本表为：
# backend = "openai"
# model = "你的Embedding模型ID"
# base_url = "https://你的供应商/v1" # 或 http://127.0.0.1:8080/v1
# api_key = "${MEMORIA_EMBEDDING_API_KEY}" # 回环服务无鉴权可留空
# 不设置device；BGE分块/指令仅用于已支持的本地BGE，通用API不自动套用。
